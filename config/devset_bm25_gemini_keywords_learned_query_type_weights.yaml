lm_type: "meta-llama/Llama-3.2-1B-Instruct"
retrieval_type: "bm25"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"

track_split_types:
  - "all_tracks"

user_split_types:
  - "all_users"

corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
  - "release_date"
  - "release_decade"

cache_dir: "./cache"
device: "cuda"
attn_implementation: "eager"
retrieval_only: true

use_gemini_expansion: true
gemini_expansion_mode: "controlled_keyword_query"
gemini_model_name: "gemini-3.1-flash-lite-preview"
gemini_cache_dir: "./cache/gemini_keywords_devset_first100"
gemini_keyword_block_weight: 2
gemini_keyword_field_weights:
  track_titles: 6
  artists: 6
  albums: 4
  genres: 1
  moods: 1
  instruments: 1
  themes: 1
  era: 1
  must_include_terms: 2
gemini_topk_per_reference: 50
gemini_rrf_k: 60
include_original_query_in_fusion: false
original_query_weight: 1.0
gemini_reference_weight: 1.0

use_query_type_routing: true
query_type_candidate_topk: 100
learned_query_type_weights_path: "./models/query_type_logistic_weights.json"
