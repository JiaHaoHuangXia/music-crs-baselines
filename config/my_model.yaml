# config/my_model.yaml
lm_type: "meta-llama/Llama-3.2-1B-Instruct" #"Qwen/Qwen3-4B" # change llama to qwen3
retrieval_type: "bert"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types: # What info is used for retrieval
  - "track_name"
  - "artist_name"
  - "album_name"
  - "release_date"
cache_dir: "./cache"
device: "cpu" #"cuda"
attn_implementation: "eager" #"flash_attention_2" 