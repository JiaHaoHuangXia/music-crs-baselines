lm_type: "meta-llama/Llama-3.2-1B-Instruct"
retrieval_type: "sentence_transformer"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"

track_split_types:
  - "all_tracks"

user_split_types:
  - "all_users"

corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "artist_style_profile"
  - "release_decade"

cache_dir: "./cache"
device: "cuda"
attn_implementation: "eager"
retrieval_only: true

use_gemini_expansion: true
gemini_expansion_mode: "multi_query_fusion"
gemini_fusion_method: "hybrid_structured_rerank"
gemini_model_name: "gemini-3.1-flash-lite-preview"
gemini_cache_dir: "./cache/gemini_expansions_devset_first100"
gemini_topk_per_reference: 50
gemini_rrf_k: 60
include_original_query_in_fusion: false
original_query_weight: 1.0
gemini_reference_weight: 1.0

hybrid_bm25_corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
hybrid_bm25_topk_per_reference: 100
hybrid_bm25_weight: 0.12
hybrid_artist_match_weight: 0.03
hybrid_album_match_weight: 0.02
hybrid_multi_source_weight: 0.03

rerank_tag_weight: 0.04
rerank_artist_profile_weight: 0.04
rerank_decade_weight: 0.02
